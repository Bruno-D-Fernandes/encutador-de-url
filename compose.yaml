services:
  db:
    image: mysql:latest
    container_name: encurta_db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"]
      timeout: 5s
      interval: 10s
      retries: 10
      # In this situation, doesn't change anything, though I am putting it just to learn about it
      # this applies to the english too
      start_period: 30s
      start_interval: 5s
    ports:
        - "3306:3306"
    volumes:
      - encurta_vl:/var/lib/mysql
    networks:
      - encurta_ntw

# now, i need to study about the difference between volume and bind amount

  backend:
    build: ./backend
    container_name: encurta_back
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - encurta_ntw
volumes:
  encurta_vl:
networks:
  encurta_ntw: